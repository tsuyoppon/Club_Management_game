name: ${COMPOSE_PROJECT_NAME:-club_management_game}

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: club_game
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  api:
    build:
      context: ./apps/api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./apps/api:/app
      - type: bind
        source: ${CLUB_GAME_BACKUP_DIR:-/Users/scide_furusawa/.club-management-game/backups}
        target: /backups
        bind:
          create_host_path: false
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres@db:5432/club_game
      - API_PREFIX=/api
      - PYTHONPATH=/app
      - GAME_BACKUP_ROOT=/backups
    depends_on:
      - db
    ports:
      - "8000:8000"
  web:
    build:
      context: ./apps/web
      args:
        API_PROXY_ORIGIN: http://api:8000
    environment:
      - API_PROXY_ORIGIN=http://api:8000
    depends_on:
      - api
    ports:
      - "3000:3000"
    profiles:
      - web
volumes:
  pgdata:
    name: ${CLUB_GAME_PGDATA_VOLUME:-club_management_game_pgdata}
